
name: Develop - Run iOS Tests

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "BSApp/BSApp.xcodeproj" \
            -scheme "BSApp" \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath "$RUNNER_TEMP/DevelopTests.xcresult"
